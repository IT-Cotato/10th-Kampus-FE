name: Manual Release and Deploy

on:
  # 개발자가 GitHub UI에서 직접 실행할 수 있도록 수동 트리거를 설정합니다.
  workflow_dispatch:

jobs:
  release-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 태그와 릴리즈 생성을 위해 필수
    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v4
        with:
          # develop 브랜치의 최신 코드를 가져옵니다.
          ref: 'develop'
          fetch-depth: 0

      - name: Get latest commit SHA
        id: get_sha
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Get next version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION_PARTS=(${LATEST_TAG//./ })
          MAJOR=${VERSION_PARTS[0]#v}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}
          NEW_PATCH=$((PATCH + 1))
          NEW_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          # CI가 만든 아티팩트를 커밋 해시를 이용해 정확히 찾아 다운로드합니다.
          name: dist-${{ steps.get_sha.outputs.sha }}
          path: dist/
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Deploy to S3
        run: aws s3 sync ./dist s3://kampus-bucket --delete

      - name: Invalidate CloudFront Cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_DISTRIBUTION_ID }} --paths "/*"

      - name: Create Release and Tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: 'Release ${{ steps.version.outputs.new_tag }}'
          # 배포가 완료된 후에 해당 커밋에 태그를 붙이고 릴리즈를 생성합니다.
          generate_release_notes: true
